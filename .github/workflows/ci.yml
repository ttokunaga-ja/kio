name: CI

on:
  push:
  pull_request:

# Keep only product-connected gates on every push and pull request. Retired
# non-authorizing design experiments remain recoverable from Git history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All jobs only checkout and validate repository contents. Add narrower
# job-level permissions if a future step needs write access.
permissions:
  contents: read

jobs:
  acceptance-tooling:
    # The Rust workspace owns Rust acceptance tests. Check the fixed shell
    # controllers and mocked Linux preflight without provisioning a host.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Build and test the Rust Linux preflight without provisioning
        run: |
          cargo +1.98.0 build -p kio-ci --bin kio-prepare-linux-confinement --locked
          cargo +1.98.0 test -p kio-ci --bin kio-prepare-linux-confinement --locked
      - name: Test and report code limits (R1)
        shell: bash
        run: |
          cargo +1.98.0 test -p kio-ci --bin kio-code-limits --locked
          status=0
          cargo +1.98.0 run -q -p kio-ci --bin kio-code-limits --locked -- --root . || status=$?
          case "$status" in
            0|1) ;;
            *) exit "$status" ;;
          esac
      - name: Check fixed shell controllers and Linux preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/v1-local-gpu/gpu-phase.sh
          bash -n scripts/v1-local-gpu/ocr_api_entrypoint.sh
          bash -n scripts/ci/prepare-linux-confinement.sh

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check canonical workflow action references
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          test "${#workflow_files[@]}" -gt 0
          uses_key_count="$({
            grep -hEo "(^|[[:space:]{,])([\"']?uses[\"']?)[[:space:]]*:" \
              "${workflow_files[@]}" || true
          } | wc -l | tr -d '[:space:]')"
          references="$(
            sed -nE \
              's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*([^[:space:]#]+).*/\2/p' \
              "${workflow_files[@]}"
          )"
          reference_count="$(
            printf '%s\n' "$references" | sed '/^$/d' | wc -l | tr -d '[:space:]'
          )"
          if [[ "$uses_key_count" != "$reference_count" ]]; then
            echo "workflow uses entries must use the canonical block form" >&2
            exit 1
          fi
          invalid=0
          while IFS= read -r reference; do
            [[ -n "$reference" ]] || continue
            if [[ ! "$reference" =~ ^[^@[:space:]]+/[^@[:space:]]+@[0-9a-f]{40}$ ]]; then
              printf 'mutable or malformed external action reference: %s\n' "$reference" >&2
              invalid=1
            fi
          done <<< "$references"
          test "$invalid" -eq 0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy, rustfmt
      - name: Build pinned Linux resource preflight helper
        run: cargo +1.98.0 build -p kio-ci --bin kio-prepare-linux-confinement --locked
      - name: Install Linux renderer confinement runtime
        run: bash scripts/ci/prepare-linux-confinement.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'

  synthetic-history-eval:
    needs: rust
    runs-on: ubuntu-24.04
    # Attempt 1 completed in 04:06. Together with rust this finite bound is the
    # 55-minute dependency critical-path budget (45 + 10).
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      # Optional ranking features must take this same eval path; `--all-features`
      # prevents a default-off ranking lane from bypassing the only Recall gate.
      - run: >-
          cargo build --release --locked --all-features
          -p kio-cli -p kio-eval --bins
      # This lane has no fixture/product network dependency. Rust v3 creates
      # two isolated, create-only corpus destinations: current text and a
      # derived history overlay.
      - run: >-
          target/release/kio-eval scale generate
          --out /tmp/kio-scale-tiny-current --profile tiny --lane current-text
      - run: >-
          target/release/kio-eval scale prepare
          --corpus /tmp/kio-scale-tiny-current --bin target/release/kio
      - run: >-
          target/release/kio-eval scale attest
          --corpus /tmp/kio-scale-tiny-current
      - run: >-
          target/release/kio-eval scale generate
          --out /tmp/kio-scale-tiny-history --profile tiny --lane history-overlay
      - run: >-
          target/release/kio-eval scale prepare
          --corpus /tmp/kio-scale-tiny-history --bin target/release/kio
      - run: >-
          target/release/kio-eval scale attest
          --corpus /tmp/kio-scale-tiny-history
      # This is a contract smoke only: tiny fixtures are deliberately not
      # performance-acceptance eligible.
      - run: >-
          target/release/kio-eval scale benchmark
          --current-corpus /tmp/kio-scale-tiny-current
          --history-corpus /tmp/kio-scale-tiny-history --bin target/release/kio
          --warmups 1 --samples 1 --out /tmp/kio-scale-tiny-rust-smoke.json
      - run: target/release/kio-eval generate-corpus --out /tmp/kio-eval-corpus
      # replay-history rejects hardlinked executables at its trust boundary.
      - run: install -m 0755 target/release/kio /tmp/kio-replay-kio
      - run: >-
          target/release/kio-eval replay-history
          --corpus /tmp/kio-eval-corpus --bin /tmp/kio-replay-kio
      - run: >-
          target/release/kio-eval crossscope --dry-run
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --out /tmp/kio-crossscope-unused.json
      - run: >-
          target/release/kio-eval crossscope
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --out /tmp/kio-crossscope-results.json
      - run: >-
          target/release/kio-eval rerank dump --dataset synthetic
          --golden eval/golden-queries-short.jsonl
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
          --limit 10 --out /tmp/kio-rerank-input.json
      - run: gzip -dc eval/rerank/rerank-input-fixture.json.gz > /tmp/kio-rerank-fixture-input.json
      - run: gzip -dc eval/rerank/rerank-output-bge-reranker-v2-m3.json.gz > /tmp/kio-rerank-fixture-output.json
      - run: >-
          target/release/kio-eval rerank apply
          --input /tmp/kio-rerank-fixture-input.json
          --output /tmp/kio-rerank-fixture-output.json
          --report /tmp/kio-rerank-fixture-report.json
      - run: target/release/kio-eval --scenario M3-1 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      # The short-query corpus has a measured 22/24 baseline. Unlike the saturated
      # 50-query set, this gate has room to detect both improvements and regressions.
      - run: >-
          target/release/kio-eval --golden eval/golden-queries-short.jsonl
          --scenario M3-1 --min-recall 0.9166666666666666
          --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: target/release/kio-eval --scenario M3-2 --corpus /tmp/kio-eval-corpus --bin target/release/kio
      - run: target/release/kio-eval --scenario M3-3 --corpus /tmp/kio-eval-corpus --bin target/release/kio

  macos-security-r23:
    runs-on: macos-26
    # The full native suite now exceeds 40 minutes locally. Keep an explicit,
    # finite cap with sufficient macOS host headroom.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      # Build only the isolated bootstrap before other repository crates.
      - name: Build pinned SDK preparation helper
        if: runner.os == 'macOS'
        run: cargo +1.98.0 build -p kio-ci --bin kio-prepare-macos-sdk --locked
      - name: Prepare the pinned macOS SDK on the ephemeral runner
        if: runner.os == 'macOS'
        run: sudo /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "$PWD/target/debug/kio-prepare-macos-sdk"
      - run: cargo test --workspace --all-targets --locked
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'

  windows-workspace-tests:
    runs-on: windows-2025
    # The two groups are complements, so every test runs once across the matrix.
    # kio-cli's step3_p0_contract takes about 21 minutes on Windows (2.5 on Linux),
    # so it runs in the short reconciliation group instead of the remaining group.
    # Excluding kio-cli does not change the dependency features, so neither group
    # rebuilds dependencies.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [reconciliation, remaining]
    env:
      RECONCILIATION_FILTER: tests::index_reconciles_more_than_legacy_child_cap_and_deep_pages_in_one_run
      VERIFY_OBJECTS_FILTER: verify_objects::tests::apply_removes_only_what_the_plan_listed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy, rustfmt
      - if: matrix.group == 'remaining'
        run: cargo fmt --all -- --check
      - if: matrix.group == 'remaining'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run complementary workspace tests
        shell: pwsh
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          $skip = @('--skip', $env:RECONCILIATION_FILTER, '--skip', $env:VERIFY_OBJECTS_FILTER)
          if ('${{ matrix.group }}' -eq 'reconciliation') {
            cargo test --workspace --all-targets --locked -- "$env:RECONCILIATION_FILTER" "$env:VERIFY_OBJECTS_FILTER"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test -p kio-cli --test step3_p0_contract --locked -- @skip
          } else {
            cargo test --workspace --exclude kio-cli --all-targets --locked -- @skip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $cliTests = Get-ChildItem crates/kio-cli/tests -Filter *.rs |
              Where-Object { $_.BaseName -ne 'step3_p0_contract' } |
              ForEach-Object { '--test', $_.BaseName }
            cargo test -p kio-cli --bins @cliTests --locked -- @skip
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-security-r23:
    needs: windows-workspace-tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both Windows test groups to succeed
        env:
          WINDOWS_RESULT: ${{ needs.windows-workspace-tests.result }}
        run: test "$WINDOWS_RESULT" = success
