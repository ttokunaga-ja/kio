name: Probe Windows Office readiness

on:
  push:
    branches: [probe/appcontainer]

permissions:
  contents: read

env:
  OFFICE_VERSION: "26.8.0.3"
  OFFICE_WINDOWS_X64_SHA256: 4aa6c6e1895f4055104effcb556bd3362d20c6ad707c149543304f395ef9db95

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy, rustfmt

      - name: Provision Windows Office prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP "LibreOffice_$env:OFFICE_VERSION`_Win_x86-64.msi"
          Invoke-WebRequest -Uri "https://downloadarchive.documentfoundation.org/libreoffice/old/$env:OFFICE_VERSION/win/x86_64/LibreOffice_$env:OFFICE_VERSION`_Win_x86-64.msi" -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:OFFICE_WINDOWS_X64_SHA256) {
            throw 'downloaded LibreOffice MSI hash differs from the pinned release hash'
          }
          # Start-Process -Wait also waits for the msiexec service (/V) that outlives the install.
          $log = Join-Path $env:RUNNER_TEMP 'kio-v1-office-msi.log'
          $install = Start-Process msiexec.exe -PassThru -NoNewWindow -ArgumentList @('/i', $installer, '/qn', '/norestart', '/l*v', $log)
          if (-not $install.WaitForExit(1200000)) { Get-Content -LiteralPath $log -Tail 60; throw 'LibreOffice MSI did not finish within 20 minutes' }
          if ($install.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 60; throw "LibreOffice MSI exited with $($install.ExitCode)" }
          $converter = Join-Path $env:ProgramFiles 'LibreOffice\program\soffice.exe'
          if (-not (Test-Path -LiteralPath $converter -PathType Leaf)) {
            throw "LibreOffice converter was not installed at $converter"
          }
          "KIO_OFFICE_CONVERTER=$converter" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Prefetch pinned LiteRT-LM
        shell: bash
        run: bash scripts/ci/fetch-litert-runtime.sh

      - name: Build release kio from the pushed commit
        shell: bash
        run: cargo +1.98.0 build --release --locked --all-features -p kio-cli --bin kio

      - name: Compare direct LibreOffice conversions
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'crates/kio-adapter/fixtures/office-probe.docx'
          $program = Split-Path -Parent $env:KIO_OFFICE_CONVERTER

          function Invoke-OfficeConversion($launcher, [switch]$MatchKio) {
            $work = [IO.Directory]::CreateTempSubdirectory('kio-office-direct-').FullName
            try {
              Copy-Item -LiteralPath $fixture -Destination (Join-Path $work 'input.docx')
              $profileName = if ($MatchKio) { 'lo-profile' } else { 'profile' }
              $profile = [IO.Directory]::CreateDirectory((Join-Path $work $profileName)).FullName
              [void][IO.Directory]::CreateDirectory((Join-Path $work 'out'))
              $profileUri = ([Uri]$profile).AbsoluteUri
              $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $program $launcher))
              $start.WorkingDirectory = $work
              $start.UseShellExecute = $false
              $start.CreateNoWindow = $true
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $start.ArgumentList.Add('--headless')
              if ($MatchKio) {
                # Match kio's Windows child environment and verbatim profile path.
                $profileUri = 'file://///%3F/' + $profileUri.Substring('file:///'.Length)
                $start.Environment.Clear()
                $start.Environment['SystemRoot'] = $env:SystemRoot
                $start.Environment['WINDIR'] = $env:SystemRoot
                $start.Environment['PATH'] = "${env:SystemRoot}\System32;$env:SystemRoot"
                foreach ($key in 'HOME', 'USERPROFILE', 'LOCALAPPDATA') {
                  $start.Environment[$key] = '\\?\' + $profile
                }
              } else {
                $start.ArgumentList.Add('--norestore')
              }
              foreach ($arg in "-env:UserInstallation=$profileUri", '--convert-to', 'pdf', '--outdir', 'out', 'input.docx') {
                $start.ArgumentList.Add($arg)
              }

              Write-Host "$launcher matching_kio=$MatchKio cwd=$work"
              Write-Host ($start.ArgumentList -join ' ')
              $child = [Diagnostics.Process]::Start($start)
              try {
                $stdout = $child.StandardOutput.ReadToEndAsync()
                $stderr = $child.StandardError.ReadToEndAsync()
                if ($child.WaitForExit(120000)) {
                  Write-Host "exit_code=$($child.ExitCode)"
                } else {
                  Write-Host 'timed_out_after_seconds=120'
                  try { $child.Kill($true) } catch { Write-Warning $_ }
                }
                foreach ($stream in @{ stdout = $stdout; stderr = $stderr }.GetEnumerator()) {
                  if ($stream.Value.Wait(2000)) {
                    $line = $stream.Value.Result.Trim()
                    Write-Host "$($stream.Key)=$($line.Substring(0, [Math]::Min(8192, $line.Length)))"
                  } else {
                    Write-Host "$($stream.Key) could not be drained within 2 seconds"
                  }
                }
              } finally {
                $child.Dispose()
              }
            } catch {
              Write-Warning $_
            } finally {
              Write-Host "input_pdf_exists=$(Test-Path -LiteralPath (Join-Path $work 'out/input.pdf') -PathType Leaf)"
              Get-ChildItem -LiteralPath $work -Recurse -Force -ErrorAction Continue |
                Select-Object -First 200 |
                ForEach-Object { [IO.Path]::GetRelativePath($work, $_.FullName) }
            }
          }

          Invoke-OfficeConversion 'soffice.com'
          Invoke-OfficeConversion 'soffice.exe'
          Invoke-OfficeConversion 'soffice.exe' -MatchKio

      - name: Check Windows Office readiness
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/release/kio.exe"
          work="$(mktemp -d "$RUNNER_TEMP/kio-office-readiness.XXXXXXXX")"
          work="$(cygpath -am "$work")"
          mkdir "$work"/{scope,home,cfg,data,cache,tmp}
          run_kio() {
            env -i SystemRoot="$SYSTEMROOT" KIO_OFFICE_CONVERTER="$KIO_OFFICE_CONVERTER" \
              HOME="$work/home" USERPROFILE="$work/home" APPDATA="$work/cfg" LOCALAPPDATA="$work/data" \
              XDG_CONFIG_HOME="$work/cfg" XDG_DATA_HOME="$work/data" XDG_CACHE_HOME="$work/cache" \
              TEMP="$work/tmp" TMP="$work/tmp" TMPDIR="$work/tmp" "$binary" "$@"
          }
          cd "$work/scope"
          run_kio --json init "$work/scope" >/dev/null
          TIMEFORMAT='elapsed_seconds=%3R'
          time run_kio --json status > "$work/status.json"
          jq -ce 'if has("scope_path") then .office_readiness // {state: "ready"} else error("missing status scope") end' "$work/status.json"
          jq -e '.office_readiness == null' "$work/status.json" >/dev/null
