name: probe convert
on:
  push:
    branches: [probe/office-fix]
permissions: { contents: read }
jobs:
  convert:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $i = Join-Path $env:RUNNER_TEMP 'lo.msi'
          Invoke-WebRequest -Uri 'https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.0.3/win/x86_64/LibreOffice_26.8.0.3_Win_x86-64.msi' -OutFile $i
          $p = Start-Process msiexec.exe -PassThru -NoNewWindow -ArgumentList @('/i', $i, '/qn', '/norestart')
          if (-not $p.WaitForExit(1200000) -or $p.ExitCode -ne 0) { throw 'msi' }
          $prog = Join-Path $env:ProgramFiles 'LibreOffice\program'
          $src = Join-Path $env:RUNNER_TEMP 'src'; New-Item -ItemType Directory $src | Out-Null
          Copy-Item crates/kio-adapter/fixtures/office-probe.docx $src
          foreach ($exe in 'soffice.com','soffice.exe') {
            $out = Join-Path $env:RUNNER_TEMP "out-$exe"; New-Item -ItemType Directory $out | Out-Null
            $prof = 'file:///' + ((Join-Path $env:RUNNER_TEMP "prof-$exe") -replace '\\','/')
            $t = Get-Date
            $q = Start-Process -FilePath (Join-Path $prog $exe) -PassThru -NoNewWindow -ArgumentList @("-env:UserInstallation=$prof", '--headless', '--norestore', '--nolockcheck', '--convert-to', 'pdf', '--outdir', $out, (Join-Path $src 'office-probe.docx'))
            $done = $q.WaitForExit(180000)
            $secs = [int]((Get-Date) - $t).TotalSeconds
            if (-not $done) { $q.Kill($true) }
            "$exe done=$done exit=$(if ($done) { $q.ExitCode } else { 'n/a' }) secs=$secs pdf=$((Get-ChildItem $out -Filter *.pdf | Measure-Object).Count)"
            Get-CimInstance Win32_Process -Filter "Name like 'soffice%'" | ForEach-Object { "  still running: $($_.Name) $($_.ProcessId)" }
            Get-Process soffice* -ErrorAction SilentlyContinue | Stop-Process -Force
          }
