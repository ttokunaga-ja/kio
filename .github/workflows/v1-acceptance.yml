            > "$RUNNER_TEMP/kio-v1-a08-mock-failure-summary.json"
          "$eval_bin" acceptance run \
            --expected-case "$KIO_A10_EXPECTED_CASE" --case A10 --lane native-contract --subcase core \
            --os "${{ matrix.native_os }}" --bin "$KIO_RELEASE_BIN" \
            --contract-bin "$KIO_CONTRACT_BIN" --fixture "$KIO_A10_FIXTURE" \
            --work-dir "$RUNNER_TEMP/kio-v1-a10-work" \
            --receipt "$RUNNER_TEMP/kio-v1-a10-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a10-summary.json"

      - name: Collect the real Office A07 release-binary receipt
        run: |
          set -euo pipefail
          eval_bin=target/debug/kio-eval
          if [[ "$RUNNER_OS" == "Windows" ]]; then eval_bin="${eval_bin}.exe"; fi
