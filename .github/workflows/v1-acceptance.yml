          printf 'KIO_CONTRACT_BIN=%s\n' "$contract_bin" >> "$GITHUB_ENV"

      - name: Execute A12 distribution proof against both isolated candidate archives
        run: |
          set -euo pipefail
          eval_bin=target/debug/kio-eval
          if [[ "$RUNNER_OS" == "Windows" ]]; then eval_bin="${eval_bin}.exe"; fi
          "$eval_bin" acceptance distribution \
            --expected-case "$KIO_A12_EXPECTED_CASE" --os "${{ matrix.native_os }}" \
            --archive "$KIO_RELEASE_ARCHIVE" --checksums "$KIO_RELEASE_CHECKSUMS" \
            --repro-archive "$KIO_RELEASE_REPRO_ARCHIVE" \
            --repro-checksums "$KIO_RELEASE_REPRO_CHECKSUMS" \
            --source-repo "$GITHUB_WORKSPACE" \
            --expected-lock-sha256 "$KIO_RELEASE_LOCK_SHA256" \
            --work-dir "$RUNNER_TEMP/kio-v1-a12-work" \
            --receipt "$RUNNER_TEMP/kio-v1-a12-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a12-summary.json"

      - name: Collect A01 through A07 and A09 release-binary receipts
