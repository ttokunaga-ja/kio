      - name: Collect A08 mock-failure and A10 durability contract receipts
        run: |
          set -euo pipefail
          eval_bin=target/debug/kio-eval
          if [[ "$RUNNER_OS" == "Windows" ]]; then eval_bin="${eval_bin}.exe"; fi
          "$eval_bin" acceptance run \
            --expected-case "$KIO_A08_EXPECTED_CASE" --case A08 --lane native-contract --subcase mock-failure \
