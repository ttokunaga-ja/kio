            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --architecture "$architecture" --out "$expected_a12"
          printf 'KIO_A01_EXPECTED_CASE=%s\n' "$expected_a01" >> "$GITHUB_ENV"
          printf 'KIO_A02_EXPECTED_CASE=%s\n' "$expected_a02" >> "$GITHUB_ENV"
          printf 'KIO_A03_NATIVE_EXPECTED_CASE=%s\n' "$expected_a03_native" >> "$GITHUB_ENV"
          printf 'KIO_A03_SERVICE_EXPECTED_CASE=%s\n' "$expected_a03_service" >> "$GITHUB_ENV"
          printf 'KIO_A04_EXPECTED_CASE=%s\n' "$expected_a04" >> "$GITHUB_ENV"
          printf 'KIO_A04_LOCAL_TRUST_EXPECTED_CASE=%s\n' "$expected_a04_local_trust" >> "$GITHUB_ENV"
          printf 'KIO_A05_EXPECTED_CASE=%s\n' "$expected_a05" >> "$GITHUB_ENV"
          printf 'KIO_A06_EXPECTED_CASE=%s\n' "$expected_a06" >> "$GITHUB_ENV"
