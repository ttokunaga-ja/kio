      - name: Collect A03 and A11 native scheduler receipts
        run: |
          set -euo pipefail
          eval_bin=target/debug/kio-eval
          if [[ "$RUNNER_OS" == "Windows" ]]; then eval_bin="${eval_bin}.exe"; fi
          "$eval_bin" acceptance run \
