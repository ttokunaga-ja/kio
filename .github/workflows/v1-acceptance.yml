          "$eval_bin" acceptance run \
            --expected-case "$KIO_A04_EXPECTED_CASE" --case A04 --lane native-contract --subcase core \
            --os "${{ matrix.native_os }}" --bin "$KIO_RELEASE_BIN" \
            --fixture "$KIO_A04_FIXTURE" \
            --work-dir "$RUNNER_TEMP/kio-v1-a04-work" \
            --receipt "$RUNNER_TEMP/kio-v1-a04-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a04-summary.json"
          "$eval_bin" acceptance run \
            --expected-case "$KIO_A04_LOCAL_TRUST_EXPECTED_CASE" --case A04 --lane native-contract --subcase local-trust \
            --os "${{ matrix.native_os }}" --bin "$KIO_RELEASE_BIN" \
            --fixture "$KIO_A04_FIXTURE" \
            --work-dir "$RUNNER_TEMP/kio-v1-a04-local-trust-work" \
            --receipt "$RUNNER_TEMP/kio-v1-a04-local-trust-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a04-local-trust-summary.json"
          "$eval_bin" acceptance run \
            --expected-case "$KIO_A05_EXPECTED_CASE" --case A05 --lane native-contract --subcase core \
            --os "${{ matrix.native_os }}" --bin "$KIO_RELEASE_BIN" \
            --fixture "$KIO_A05_A06_FIXTURE" \
            --work-dir "$RUNNER_TEMP/kio-v1-a05-work" \
            --receipt "$RUNNER_TEMP/kio-v1-a05-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a05-summary.json"
          "$eval_bin" acceptance run \
            --expected-case "$KIO_A06_EXPECTED_CASE" --case A06 --lane native-contract --subcase core \
            --os "${{ matrix.native_os }}" --bin "$KIO_RELEASE_BIN" \
