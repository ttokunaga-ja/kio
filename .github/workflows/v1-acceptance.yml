            --receipt "$RUNNER_TEMP/kio-v1-a11-service-receipt.json" \
            > "$RUNNER_TEMP/kio-v1-a11-service-summary.json"

      - name: Label this native lane as finished evidence, not a full matrix
        if: always()
        run: |
          {
            echo '## Native lane terminal state'
            echo
            echo "OS: \`${{ matrix.native_os }}\`"
            echo "Current step status: \`${{ job.status }}\`"
            echo 'A01/A02/A03-native/A03-service/A04-core/A04-local-trust/A05/A06/A07/A08-mock-failure/A09/A10/A11/A12 receipts are retained only as a partial subset.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kio-v1-native-${{ matrix.native_os }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/kio-v1-provisioning.txt
            ${{ runner.temp }}/kio-v1-preflight.json
            ${{ runner.temp }}/kio-v1-release-verify.json
            ${{ runner.temp }}/kio-v1-*-expected.json
            ${{ runner.temp }}/kio-v1-*-receipt.json
            ${{ runner.temp }}/kio-v1-*-summary.json
          if-no-files-found: warn
          compression-level: 0

  native-a01-a09-summary:
    name: V1 native acceptance supplement summary
    needs: native-a01-a09
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject a missing, skipped, cancelled, or failed native lane
        env:
          NATIVE_RESULT: ${{ needs.native-a01-a09.result }}
        run: |
          set -euo pipefail
          {
            echo '## V1 native acceptance supplement'
            echo
            echo "Native acceptance result: \`$NATIVE_RESULT\`"
            echo
            echo 'This workflow proves every native and local acceptance requirement against extracted release binaries on each OS; A08 mock-failure and A10 additionally bind a separately hashed debug contract binary.'
            echo 'It is not a completed v1 acceptance matrix: the A08 provider-live requirements remain in their owning provider lane and the full manifest verifier remains the final gate.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$NATIVE_RESULT" = success
