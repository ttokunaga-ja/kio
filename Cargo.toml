[workspace]
members = [
    "crates/kio-adapter",
    "crates/kio-cli",
    "crates/kio-core",
    "crates/kio-eval",
    "crates/kio-index",
    "crates/kio-pipeline",
    "crates/kio-search",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.98.0"
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
kio-core = { path = "crates/kio-core" }
kio-index = { path = "crates/kio-index" }
kio-pipeline = { path = "crates/kio-pipeline" }
kio-search = { path = "crates/kio-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
jsonschema = { version = "0.49", default-features = false }
sha2 = "0.11"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
thiserror = "2"
toml = "1.1"
# QA21 (2026-07-22 orchestrator ruling): format-preserving single-key TOML
# edits for the network-approval write path (`.kio/config.toml`'s
# `[adapter.policy].allow_network`) — `toml 1.1` already vendors this crate
# internally, so pinning the same version adds no new dependency weight.
toml_edit = "0.25"
unicode-normalization = "0.1"
base64 = "0.23"
cap-primitives = "4.0.2"
# Offline PDF text extraction (07 §2.1): real-world text-layer PDFs
# (TeX / LibreOffice output) carry FlateDecode-compressed content streams and
# ToUnicode CMaps; miniz_oxide is the bounded inflate primitive. Pure Rust,
# no C build, already the narrow-waist inflate crate of the flate2 ecosystem.
miniz_oxide = "0.9"
getrandom = "0.4"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell"] }
sqlite-vec = "0.1.9"
