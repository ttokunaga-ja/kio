[package]
name = "kio-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
notify = "8.2.0"
cap-primitives.workspace = true
getrandom.workspace = true
kio-adapter = { path = "../kio-adapter" }
kio-core.workspace = true
kio-index.workspace = true
kio-pipeline.workspace = true
kio-process.workspace = true
kio-search.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-normalization.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64.workspace = true
miniz_oxide.workspace = true
serde_jcs.workspace = true
tempfile.workspace = true
