[package]
name = "kio-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "kio"
path = "src/main.rs"

[dependencies]
kio-app.workspace = true
clap.workspace = true
kio-core.workspace = true
kio-index = { path = "../kio-index" }
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Authenticated loopback barrier fixtures reuse the adapter test TLS stack.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
assert_cmd = "2"
kio-adapter = { path = "../kio-adapter" }
kio-pipeline = { path = "../kio-pipeline" }
rusqlite = { workspace = true, features = ["hooks"] }
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
base64.workspace = true
# step4b_flate_contract.rs compresses its PDF fixtures at test time so the
# FlateDecode extraction path is exercised against real zlib streams.
miniz_oxide.workspace = true
serde_jcs.workspace = true
tempfile = "3"
